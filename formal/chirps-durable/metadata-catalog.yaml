    planned_local_component_test: [{repository: iggy-compatible, path: core/server/src/chirps_extension/resource_store.rs, task: "5.3", check: restart-retention-and-destructive-identity-matrix}, {repository: chirps, path: tests/e2e/tests/durable_metadata_recovery.rs, task: "6.13"}]
