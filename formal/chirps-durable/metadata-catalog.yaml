    refinement: [{repository: iggy-compatible, path: core/server/src/chirps_extension/resource_store.rs, task: "5.3"}, {repository: iggy-compatible, path: core/server/src/chirps_extension/mutation.rs, task: "5.6"}]
    planned_local_component_test: [{repository: iggy-compatible, path: core/server/src/chirps_extension/mutation.rs, task: "5.6", check: durable-identity-install-fence-mutation-order}, {repository: chirps, path: tests/e2e/tests/durable_metadata_recovery.rs, task: "6.13"}]
    red_profiles: [identity-install-before-durable, mutation-before-epoch-durable, mutation-before-fence, install-unknown-continues]
  - id: V7-FAULT-003
