    refinement: [{repository: iggy-compatible, path: core/server/src/chirps_extension/resource_snapshot.rs, task: "5.3"}]
    planned_local_component_test: [{repository: iggy-compatible, path: core/server/src/chirps_extension/resource_snapshot.rs, task: "5.3", check: temp-sync-rename-directory-install-failpoints}, {repository: chirps, path: tests/e2e/tests/durable_metadata_recovery.rs, task: "6.13"}]
    red_profiles: [torn-snapshot-applied, mixed-snapshot-applied, omit-directory-sync, infer-file-sync-success, infer-directory-sync-success]
