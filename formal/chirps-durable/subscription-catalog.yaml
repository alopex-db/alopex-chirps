schema: alopex-formal-catalog/v1
model:
  id: chirps-v0-7-subscription
  language: TLA+
  implementation_status: pre-production-contract
  checker:
    name: Apalache
    image: ghcr.io/apalache-mc/apalache@sha256:fde994fd109323934b9abb7ad169de37b29acf2141483367f2913cae30ff3795
    profile: bounded-model-check
    max_steps: 28
    constants: {MaxOffset: 3, MaxOwnerEpoch: 2, MaxDeliveryAttempts: 2, LivenessBudget: 3, UnsafeMode: none}
    execution:
      working_directory: formal
      typecheck: "rtk docker compose -f compose.yml run --rm apalache typecheck chirps-durable/Subscription.tla"
      normal: "rtk docker compose -f compose.yml run --rm apalache check --config=chirps-durable/Subscription.cfg --length=28 chirps-durable/Subscription.tla"
      profile_command: "rtk docker compose -f compose.yml run --rm apalache check --config=${temporary_output} --length=${max_steps} chirps-durable/Subscription.tla"
      witness_command: "rtk docker compose -f compose.yml run --rm apalache check --config=${temporary_output} --length=${max_steps} chirps-durable/Subscription.tla"
      profile_materialization:
        base_config: chirps-durable/Subscription.cfg
        constant_replacement: {name: UnsafeMode, from: none, to: "${constant_overrides.UnsafeMode}"}
        next_replacement: {from: Next, to: UnsafeAction}
        invariant_selection: [TypeOK, "${target}"]
        temporary_output: "tmp/Subscription-${id}.cfg"
      witness_materialization:
        base_config: chirps-durable/Subscription.cfg
        next_replacement: {from: Next, to: "${next}"}
        invariant_selection: [TypeOK, "${target}"]
        temporary_output: "tmp/Subscription-${id}.cfg"
      cleanup: "Remove only generated tmp/Subscription-*.cfg and formal/_apalache-out after evidence capture."
    mutation_profiles:
      - {id: poll-mixed, constant_overrides: {UnsafeMode: poll-mixed}, target: PollObservationCoherent, expected: counterexample, max_steps: 2}
      - {id: misroute-delivered, constant_overrides: {UnsafeMode: misroute-delivered}, target: MisrouteNeverDeliveredOrAcked, expected: counterexample, max_steps: 2}
      - {id: identity-conflict-delivered, constant_overrides: {UnsafeMode: identity-conflict-delivered}, target: IdentityConflictStopsPartition, expected: counterexample, max_steps: 2}
      - {id: delivery-before-identity, constant_overrides: {UnsafeMode: delivery-before-identity}, target: IdentityPersistedBeforeDelivery, expected: counterexample, max_steps: 2}
      - {id: resolved-start-change, constant_overrides: {UnsafeMode: resolved-start-change}, target: ResolvedStartNeverChanges, expected: counterexample, max_steps: 2}
      - {id: owner-fork, constant_overrides: {UnsafeMode: owner-fork}, target: SingleOwnerEpoch, expected: counterexample, max_steps: 2}
      - {id: double-inflight, constant_overrides: {UnsafeMode: double-inflight}, target: SingleInflightPerPartition, expected: counterexample, max_steps: 2}
      - {id: handle-substitution, constant_overrides: {UnsafeMode: handle-substitution}, target: HandleBoundToExactDelivery, expected: counterexample, max_steps: 2}
      - {id: old-handle-ack, constant_overrides: {UnsafeMode: old-handle-ack}, target: OldHandleCannotAckRedelivery, expected: counterexample, max_steps: 2}
      - {id: stale-handle-ack, constant_overrides: {UnsafeMode: stale-handle-ack}, target: StaleHandleNeverAdvances, expected: counterexample, max_steps: 2}
      - {id: poll-owner-change, constant_overrides: {UnsafeMode: poll-owner-change}, target: PollReservationFencesOwner, expected: counterexample, max_steps: 2}
      - {id: delivery-without-reservation, constant_overrides: {UnsafeMode: delivery-without-reservation}, target: PollReservationFencesOwner, expected: counterexample, max_steps: 2}
      - {id: poll-before-checkpoint, constant_overrides: {UnsafeMode: poll-before-checkpoint}, target: NoPollPastUncommittedCheckpoint, expected: counterexample, max_steps: 2}
      - {id: known-old-terminal, constant_overrides: {UnsafeMode: known-old-terminal}, target: KnownOldCheckpointIsRetryable, expected: counterexample, max_steps: 2}
      - {id: unknown-keeps-active, constant_overrides: {UnsafeMode: unknown-keeps-active}, target: UnknownCheckpointStopsPartition, expected: counterexample, max_steps: 2}
      - {id: recovery-neither, constant_overrides: {UnsafeMode: recovery-neither}, target: RecoveryChoosesCompleteOldOrNew, expected: counterexample, max_steps: 2}
      - {id: invalid-state-active, constant_overrides: {UnsafeMode: invalid-state-active}, target: NoActiveFromInvalidState, expected: counterexample, max_steps: 2}
      - {id: advisory-advances, constant_overrides: {UnsafeMode: advisory-advances}, target: AdvisoryOffsetNeverOwnsFrontier, expected: counterexample, max_steps: 2}
      - {id: effect-not-redelivered, constant_overrides: {UnsafeMode: effect-not-redelivered}, target: EffectBeforeCheckpointMayRedeliver, expected: counterexample, max_steps: 2}
      - {id: invalid-exact-commits, constant_overrides: {UnsafeMode: invalid-exact-commits}, target: InvalidExactNeverCommitsManifest, expected: counterexample, max_steps: 2}
      - {id: unknown-creation-polls, constant_overrides: {UnsafeMode: unknown-creation-polls}, target: UnknownCreationBlocksPollAndOverwrite, expected: counterexample, max_steps: 2}
      - {id: double-handle-winner, constant_overrides: {UnsafeMode: double-handle-winner}, target: SingleHandleTerminalWinner, expected: counterexample, max_steps: 2}
      - {id: offset-wrap, constant_overrides: {UnsafeMode: offset-wrap}, target: ExpectedIsCheckedSuccessor, expected: counterexample, max_steps: 2}
      - {id: tail-incoherent, constant_overrides: {UnsafeMode: tail-incoherent}, target: HMonotonicAndTailCoherent, expected: counterexample, max_steps: 2}
      - {id: selected-skip, constant_overrides: {UnsafeMode: selected-skip}, target: NoSelectedOffsetSkip, expected: counterexample, max_steps: 2}
      - {id: namespace-unfenced, constant_overrides: {UnsafeMode: namespace-unfenced}, target: DestructiveChangeFencesNamespace, expected: counterexample, max_steps: 2}
      - {id: liveness-stalled, constant_overrides: {UnsafeMode: liveness-stalled}, target: AtLeastOnceUnderAssumptions, expected: counterexample, max_steps: 2}
      - {id: liveness-weak-selected, constant_overrides: {UnsafeMode: liveness-weak-selected}, target: LivenessAssumptionsPresent, expected: counterexample, max_steps: 2}
      - {id: liveness-offset-before-e0, constant_overrides: {UnsafeMode: liveness-offset-before-e0}, target: LivenessAssumptionsPresent, expected: counterexample, max_steps: 2}
      - {id: liveness-no-broker, constant_overrides: {UnsafeMode: liveness-no-broker}, target: LivenessAssumptionsPresent, expected: counterexample, max_steps: 2}
      - {id: liveness-no-recovery, constant_overrides: {UnsafeMode: liveness-no-recovery}, target: LivenessAssumptionsPresent, expected: counterexample, max_steps: 2}
      - {id: liveness-no-subscription, constant_overrides: {UnsafeMode: liveness-no-subscription}, target: LivenessAssumptionsPresent, expected: counterexample, max_steps: 2}
      - {id: liveness-no-retention, constant_overrides: {UnsafeMode: liveness-no-retention}, target: LivenessAssumptionsPresent, expected: counterexample, max_steps: 2}
      - {id: liveness-unfair-poll, constant_overrides: {UnsafeMode: liveness-unfair-poll}, target: LivenessAssumptionsPresent, expected: counterexample, max_steps: 2}
      - {id: liveness-unfair-redelivery, constant_overrides: {UnsafeMode: liveness-unfair-redelivery}, target: LivenessAssumptionsPresent, expected: counterexample, max_steps: 2}
      - {id: liveness-corrupt, constant_overrides: {UnsafeMode: liveness-corrupt}, target: LivenessAssumptionsPresent, expected: counterexample, max_steps: 2}
      - {id: liveness-no-capacity, constant_overrides: {UnsafeMode: liveness-no-capacity}, target: LivenessAssumptionsPresent, expected: counterexample, max_steps: 2}
      - {id: liveness-owner-change, constant_overrides: {UnsafeMode: liveness-owner-change}, target: LivenessAssumptionsPresent, expected: counterexample, max_steps: 2}
      - {id: liveness-resource-change, constant_overrides: {UnsafeMode: liveness-resource-change}, target: LivenessAssumptionsPresent, expected: counterexample, max_steps: 2}
      - {id: liveness-inbox-change, constant_overrides: {UnsafeMode: liveness-inbox-change}, target: LivenessAssumptionsPresent, expected: counterexample, max_steps: 2}
      - {id: retention-as-tail, constant_overrides: {UnsafeMode: retention-as-tail}, target: RetentionLossNeverLooksLikeTail, expected: counterexample, max_steps: 2}
      - {id: corrupt-delivered, constant_overrides: {UnsafeMode: corrupt-delivered}, target: CorruptRecordNeverDelivered, expected: counterexample, max_steps: 2}
      - {id: read-failure-advances, constant_overrides: {UnsafeMode: read-failure-advances}, target: ReadFailureNeverAdvancesFrontier, expected: counterexample, max_steps: 2}
      - {id: invalid-prefix-active, constant_overrides: {UnsafeMode: invalid-prefix-active}, target: RecoveryUsesContiguousValidPrefix, expected: counterexample, max_steps: 2}
      - {id: early-creation-success, constant_overrides: {UnsafeMode: early-creation-success}, target: SuccessAfterRequiredSyncs, expected: counterexample, max_steps: 2}
      - {id: early-checkpoint-success, constant_overrides: {UnsafeMode: early-checkpoint-success}, target: SuccessAfterRequiredSyncs, expected: counterexample, max_steps: 2}
      - {id: checkpoint-outcome-mismatch, constant_overrides: {UnsafeMode: checkpoint-outcome-mismatch}, target: CheckpointOutcomeMatchesRecoveredState, expected: counterexample, max_steps: 2}
      - {id: creation-outcome-mismatch, constant_overrides: {UnsafeMode: creation-outcome-mismatch}, target: CreationOutcomeMatchesRecoveredState, expected: counterexample, max_steps: 2}
      - {id: duplicate-advances-frontier, constant_overrides: {UnsafeMode: duplicate-advances-frontier}, target: DuplicateDoesNotAdvanceUnackedFrontier, expected: counterexample, max_steps: 2}
    witness_profiles:
      - id: retention-scoped-at-least-once
        expected: reachable
        max_steps: 12
        next: LivenessNext
        target: LivenessWitnessAbsent
        predicate: 'state.liveTracked /\ state.liveDelivered /\ state.liveBudget = 0 /\ AllLivenessAssumptions'
      - id: duplicate-then-current-handle-ack
        expected: reachable
        max_steps: 20
        next: DuplicateRedeliveryNext
        target: DuplicateAckWitnessAbsent
        predicate: 'state.duplicateObserved /\ state.checkpointOutcome = "committed" /\ state.lastCheckpointAttempt = 2 /\ state.unackedFrontier = 2'
      - id: valid-zero-checkpoint-commit
        expected: reachable
        max_steps: 20
        next: ZeroCheckpointNext
        target: ZeroCheckpointWitnessAbsent
        predicate: 'state.scenario = "checkpoint-zero-commit" /\ state.checkpointPresent /\ state.checkpoint = 0 /\ state.checkpointOutcome = "committed" /\ state.unackedFrontier = 1'
      - id: present-old-checkpoint-tuple-recovery
        expected: reachable
        max_steps: 20
        next: PresentOldCheckpointNext
        target: PresentOldCheckpointWitnessAbsent
        predicate: 'state.scenario = "checkpoint-present-unknown-old" /\ state.lastEvent = "checkpoint-recovered-old" /\ state.checkpointPresent /\ state.checkpoint = 0 /\ state.lastCheckpointOwnerEpoch = 1 /\ state.lastCheckpointAttempt = 1 /\ state.lastCheckpointOffset = 0'
      - id: present-new-checkpoint-tuple-recovery
        expected: reachable
        max_steps: 20
        next: PresentNewCheckpointNext
        target: PresentNewCheckpointWitnessAbsent
        predicate: 'state.scenario = "checkpoint-present-unknown-new" /\ state.lastEvent = "checkpoint-recovered-new" /\ state.checkpointPresent /\ state.checkpoint = 1 /\ state.lastCheckpointOwnerEpoch = 2 /\ state.lastCheckpointAttempt = 1 /\ state.lastCheckpointOffset = 1'
    scenario_profiles:
      fixed: [creation-known-old, creation-unknown-old, creation-unknown-new, owner-reopen, poll-record-ack, checkpoint-known-old-retry, checkpoint-unknown-old, checkpoint-unknown-new, checkpoint-zero-commit, checkpoint-present-unknown-old, checkpoint-present-unknown-new, nack-redelivery, timeout-redelivery, shutdown-fence, tail, retention-gap, checkpoint-conflict, incoherent-poll, read-failure, misroute, corrupt-record, identity-conflict, advisory-mirror, effect-crash-redelivery, duplicate-redelivery, resource-change, config-change, offset-exhaustion, invalid-recovery, liveness]
      creation_matrix:
        selection: [earliest, latest, exact]
        stream: [empty, nonempty]
        invalid_exact: [below-oldest, above-high-watermark]
      checkpoint_recovery: [known-old, unknown-old, unknown-new, present-old-tuple, present-new-tuple, committed-zero, committed-new]
      handle_winners: [ack, nack-release, timeout, shutdown-fence]
    scope: "One subscription and partition, owner epochs 1..2, attempts 1..2, valid offset zero distinct from absence, offsets 0..3 plus checked exhaustion, one creation/checkpoint/recovery cycle, checked through length 28. Channel close refines ShutdownFenced."
    exclusions:
      - "This is bounded safety plus bounded conditional reachability evidence, not an infinite temporal-liveness proof."
      - "Identity-before-delivery is a design-derived auxiliary invariant; V7-STATE-001 is not claimed by Task 1.2."
      - "V7-MODEL-001 and V7-MODEL-002 are registered only for this Subscription subset; aggregate completeness remains Task 1.5."
      - "High availability, replication, broker exactly-once, mTLS, device power-loss durability and atomic data snapshots remain excluded."
      - "Lifecycle capacity, GC, compaction and shutdown protocol internals belong to Task 1.3."

repositories:
  chirps: "Task 0.2 release/v0.7.0 worktree root"
  iggy-compatible: "Task 0.3 pinned compatible-server worktree root"

