schema: alopex-formal-catalog/v1
model:
  id: chirps-tso-v0-6
  language: TLA+
  implementation_status: production-before
  checker:
    name: Apalache
    image: ghcr.io/apalache-mc/apalache@sha256:fde994fd109323934b9abb7ad169de37b29acf2141483367f2913cae30ff3795
    profile: bounded-model-check
    max_steps: 9
    constants:
      BatchLimit: 2
      LeaseLength: 2
    profiles:
      - {config: Allocation.cfg, next: AllocationNext, max_steps: 6}
      - {config: Follower.cfg, next: FollowerNext, max_steps: 3}
      - {config: Handoff.cfg, next: HandoffNext, max_steps: 9}
      - {config: Client.cfg, next: ClientNext, max_steps: 5}
      - {config: Tso.cfg, next: Next, max_steps: 5, purpose: combined-exploration}
    scope: "Three nodes, one dedicated TSO group, batch sizes 1..2, physical clock 0..3, timestamps 0..20, one client, two bounded retries, and one leader handoff."
    exclusions:
      - "Unbounded liveness, fairness, retries, and arbitrary leader changes"
      - "Raft election, replication, quorum, log matching, durability, and crash recovery"
      - "Concurrent clients, logical-counter overflow, and production timestamp bit encoding"
      - "Real-time lease precision, exponential-backoff duration, transport framing, and performance"
requirements:
  - id: TSO-RAFT-ALLOCATION
    requirement: "CHIRPS v0.6 Requirement 3"
    classification: concurrent/distributed-state
    implementation_status: planned
    failure_mode: "A follower or expired lease owner issues a timestamp, ranges overlap, or physical clock rollback regresses allocation."
    properties: [DedicatedRaftGroup, RangesAreCommitted, LeaderOnlyIssue, IssuedTimestampsMonotonic, ReservedRangesDoNotOverlap, PhysicalRollbackPreservesFloor, FollowerRejectHasNoAllocation]
    planned_refinement:
      - crates/alopex-chirps/src/tso/oracle.rs
      - crates/alopex-chirps/src/tso/state_machine.rs
      - crates/alopex-chirps/src/multi_raft/manager.rs
    planned_local_component_test:
      - crates/alopex-chirps/tests/tso_oracle.rs::leader_allocates_monotonic_non_overlapping_ranges
      - crates/alopex-chirps/tests/tso_oracle.rs::follower_returns_not_leader_without_allocating
      - crates/alopex-chirps/tests/tso_oracle.rs::physical_clock_rollback_uses_logical_floor
  - id: TSO-LEASE-HANDOFF
    requirement: "CHIRPS v0.6 Requirement 3"
    classification: concurrent/distributed-state
    implementation_status: planned
    failure_mode: "A new leader issues before the previous leader lease expires."
    properties: [LeaseHandoffSafe, LeaderOnlyIssue, IssuedTimestampsMonotonic]
    planned_refinement:
      - crates/alopex-chirps/src/tso/oracle.rs
      - crates/alopex-chirps/src/tso/lease.rs
    planned_local_component_test:
      - crates/alopex-chirps/tests/tso_handoff.rs::new_leader_waits_for_previous_lease_before_issuing
  - id: TSO-CLIENT-CACHE
    requirement: "CHIRPS v0.6 Requirement 4"
    classification: local-state
    implementation_status: planned
    failure_mode: "A client issues outside its reserved cache, accepts an incorrect leader, or loses monotonicity across refill/retry."
    properties: [ClientCacheSafe, IssuedTimestampsMonotonic, FollowerRejectHasNoAllocation]
    planned_refinement:
      - crates/alopex-client/src/tso.rs
      - crates/alopex-client/src/transport.rs
    planned_local_component_test:
      - crates/alopex-client/tests/tso_client.rs::empty_cache_fetches_and_consumes_a_committed_batch
      - crates/alopex-client/tests/tso_client.rs::not_leader_refreshes_hint_and_retries
      - crates/alopex-client/tests/tso_client.rs::retryable_failure_preserves_cache_and_monotonicity
    limitation: "Retry count and redirect/cache safety are modeled; exponential backoff timing is not."
  - id: TSO-PERFORMANCE-PROFILE
    requirement: "CHIRPS v0.6 Requirement 3 batching/cache optimization"
    classification: physical/performance-evidence
    property: not_modeled
    reason: "Throughput, latency, and batch amortization require controlled production measurements."
