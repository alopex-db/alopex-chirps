services:
  apalache:
    image: ghcr.io/apalache-mc/apalache@sha256:fde994fd109323934b9abb7ad169de37b29acf2141483367f2913cae30ff3795
    working_dir: /var/apalache
    environment:
      # Rootless Podman maps container root to the invoking host user. The
      # image entrypoint otherwise switches to uid/gid 1000 inside that user
      # namespace and cannot create its task-owned output on the bind mount.
      USER_ID: "0"
      GROUP_ID: "0"
    volumes:
      - type: bind
        source: .
        target: /var/apalache
  chirps-durable-suite:
    extends:
      file: chirps-durable/compose.yml
      service: suite
    volumes:
      - type: bind
        source: .
        target: /var/apalache
