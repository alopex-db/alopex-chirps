schema: alopex-formal-catalog/v1
model:
  id: chirps-storage-recovery-v0-6
  language: TLA+
  checker:
    name: Apalache
    image: ghcr.io/apalache-mc/apalache@sha256:fde994fd109323934b9abb7ad169de37b29acf2141483367f2913cae30ff3795
    profile: bounded-model-check
    type_features: no-rows
    max_steps: 10
  scope: "Finite append/fsync/crash/recovery and temporary/published/corrupt snapshot transitions."
  exclusions: ["Physical media write ordering", "Unbounded crash sequences"]
requirements:
  - id: STORAGE-RECOVERY-SAFETY
    classification: physical/performance evidence
    failure_mode: "A torn/corrupt WAL or snapshot is accepted as durable state."
    properties: [NoUnflushedRecovery, CorruptWalNeverAccepted, TempSnapshotNeverInstalled, CorruptSnapshotNeverInstalled]
    refinement:
      - crates/chirps-raft-storage/src/wal_storage.rs::WalRaftStorage::recover
      - crates/chirps-raft-storage/src/wal_storage.rs::WalRaftStorage::install_snapshot
    local_component_test:
      - crates/chirps-raft-storage/tests/resilience.rs
    release_evidence:
      - docs/release/evidence/v0.6.0/storage-resilience-v0.6.json
