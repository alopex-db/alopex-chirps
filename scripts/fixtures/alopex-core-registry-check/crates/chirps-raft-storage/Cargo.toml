[package]
name = "alopex-chirps-raft-storage"
version.workspace = true
edition = "2024"
description = "Raft log storage implementation for Alopex Chirps using alopex-core"
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords = ["raft", "storage", "consensus", "alopex", "chirps"]

[lints.rust]
# openraft's declare_raft_types! macro uses cfg(feature = "serde") internally
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("serde"))'] }

[dependencies]
openraft = { version = "=0.9.17", features = ["serde"] }
alopex-core = "0.3"
async-trait = "0.1"
tokio = { version = "1.35", features = ["io-util", "sync", "macros", "rt", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
bincode = "1.3"
crc32fast = "1.4"

[dev-dependencies]
tempfile = "3"
