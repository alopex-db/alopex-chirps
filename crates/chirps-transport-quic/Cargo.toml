[package]
name = "chirps-transport-quic"
version = "0.5.0"
edition = "2024"

[dependencies]
chirps-core = { path = "../chirps-core" }
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
quinn = "0.10"
chirps-wire = { path = "../chirps-wire" }
tracing = "0.1"
bytes = "1.5"
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
rcgen = "0.12"
rustls = { version = "0.21", features = ["dangerous_configuration"] }
rand = "0.8"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "ansi", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", optional = true }
metrics-util = "0.20"

[dev-dependencies]
tokio-test = "0.4"
tracing-test = "0.2"

[features]
metrics-export = ["metrics-exporter-prometheus"]
