[package]
name = "chirps-raft-storage"
version = "0.1.0"
edition = "2024"

[dependencies]
openraft = { version = "=0.9.17", features = ["serde"] }
alopex-core = { path = "../../../alopex/crates/alopex-core" }
async-trait = "0.1"
tokio = { version = "1.35", features = ["io-util", "sync", "macros", "rt", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
bincode = "1.3"
crc32fast = "1.4"

[dev-dependencies]
tempfile = "3"
