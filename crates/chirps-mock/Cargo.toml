[package]
name = "alopex-chirps-mock"
version.workspace = true
edition = "2024"
description = "Mock implementations for testing Alopex Chirps components"
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords = ["testing", "mock", "distributed", "alopex", "chirps"]

[dependencies]
alopex-chirps-core.workspace = true
alopex-chirps-wire.workspace = true
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
