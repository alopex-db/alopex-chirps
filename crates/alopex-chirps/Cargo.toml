[package]
name = "alopex-chirps"
version.workspace = true
edition = "2024"
description = "Alopex Chirps - Distributed cluster coordination with Raft consensus"
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords = ["raft", "consensus", "distributed", "cluster", "alopex"]
documentation = "https://docs.rs/alopex-chirps"

[features]
default = []
multi-raft = ["openraft/storage-v2"]

[dependencies]
alopex-chirps-core.workspace = true
alopex-chirps-file-transfer.workspace = true
alopex-chirps-gossip-swim.workspace = true
alopex-chirps-raft-storage.workspace = true
alopex-chirps-transport-quic.workspace = true
alopex-chirps-wire.workspace = true
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.35", features = ["time", "sync", "macros", "rt", "rt-multi-thread"] }
async-trait = "0.1"
tracing = "0.1"
openraft = { version = "=0.9.17", features = ["serde"] }
prometheus = "0.14"
http = "0.2"
quinn = "0.11"
sha2 = "0.10"
subtle = "2.6"

[dev-dependencies]
alopex-chirps-mock.workspace = true
tempfile = "3"
rcgen = "0.12"
serde_json = "1.0"
tracing-subscriber = "0.3"
criterion = { version = "0.5", features = ["async_tokio"] }
rand = "0.8"

[[bench]]
name = "raft_bench"
harness = false
