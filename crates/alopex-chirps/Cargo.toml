[package]
name = "alopex-chirps"
version.workspace = true
edition = "2024"
description = "Alopex Chirps - Distributed cluster coordination with Raft consensus"
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords = ["raft", "consensus", "distributed", "cluster", "alopex"]
documentation = "https://docs.rs/alopex-chirps"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.35", features = ["time", "sync", "macros", "rt", "rt-multi-thread"] }
async-trait = "0.1"
chirps-wire = { path = "../chirps-wire" }
chirps-core = { path = "../chirps-core" }
chirps-transport-quic = { path = "../chirps-transport-quic" }
chirps-gossip-swim = { path = "../chirps-gossip-swim" }
chirps-raft-storage = { path = "../chirps-raft-storage" }
tracing = "0.1"
openraft = { version = "=0.9.17", features = ["serde"] }
prometheus = "0.13"
http = "0.2"

[dev-dependencies]
tempfile = "3"
serde_json = "1.0"
tracing-subscriber = "0.3"
chirps-mock = { path = "../chirps-mock" }
criterion = { version = "0.5", features = ["async_tokio"] }
rand = "0.8"

[[bench]]
name = "raft_bench"
harness = false
