[package]
name = "alopex-chirps-gossip-swim"
version.workspace = true
edition = "2024"
description = "SWIM-based gossip protocol implementation for Alopex Chirps"
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords = ["gossip", "swim", "distributed", "alopex", "chirps"]

[features]
default = []
hlc = ["alopex-chirps-wire/hlc"]

[dependencies]
alopex-chirps-wire.workspace = true
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
rand = "0.8"
async-trait = "0.1"
tokio = { version = "1.35", features = ["time", "macros", "rt", "rt-multi-thread", "sync"] }
thiserror = "1.0"
