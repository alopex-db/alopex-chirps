[package]
name = "alopex-chirps-file-transfer"
version.workspace = true
edition = "2024"
description = "File transfer APIs for Alopex Chirps"
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords = ["file-transfer", "transfer", "alopex", "chirps"]

[dependencies]
alopex-chirps-core.workspace = true
alopex-chirps-wire.workspace = true
tokio.workspace = true
serde.workspace = true
bincode.workspace = true
quinn.workspace = true
async-trait = "0.1"
uuid = { version = "1.8.0", features = ["v4", "serde"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }
sha2 = "0.10"
blake3 = "1.5"
zstd = "0.13"
filetime = "0.2"
thiserror.workspace = true
prometheus = "0.13"
tracing.workspace = true

[dev-dependencies]
tempfile = "3.8"
rcgen = "0.12"
rustls = "0.21"
alopex-chirps-mock.workspace = true

[[test]]
name = "file_transfer"
path = "tests/integration/file_transfer.rs"

[[test]]
name = "bandwidth"
path = "tests/unit/bandwidth.rs"

[[test]]
name = "chunk_manager"
path = "tests/unit/chunk_manager.rs"

[[test]]
name = "chunk_tracker"
path = "tests/unit/chunk_tracker.rs"

[[test]]
name = "integrity"
path = "tests/unit/integrity.rs"

[[test]]
name = "path_validator"
path = "tests/unit/path_validator.rs"

[[test]]
name = "persistence"
path = "tests/unit/persistence.rs"

[[test]]
name = "stream_codec"
path = "tests/unit/stream_codec.rs"
