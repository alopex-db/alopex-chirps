[package]
name = "chirps-e2e"
version.workspace = true
edition = "2024"
description = "End-to-end integration tests for Alopex Chirps"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
autotests = false

[features]
default = []
hlc = [
    "alopex-chirps/hlc",
    "alopex-chirps-gossip-swim/hlc",
    "alopex-chirps-wire/hlc",
]

[dependencies]
alopex-chirps = { workspace = true, features = ["durable-verification"] }
alopex-chirps-backend-iggy = { workspace = true, features = ["durable-verification"] }
alopex-chirps-core = { workspace = true }
chirps-fault-oracle = { path = "../../tools/chirps-durable-harness" }
alopex-chirps-transport-quic = { workspace = true }
alopex-chirps-gossip-swim = { workspace = true }
alopex-chirps-wire = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tempfile = "3"
rcgen = "0.12"
async-trait = "0.1"
bytes.workspace = true
iggy = "=0.10.0"
iggy_binary_protocol = "=0.10.0"
iggy_common = "=0.10.0"
rmp-serde = "=1.3.1"
rustls = "0.23"
sha2 = "0.10"
serde.workspace = true
serde_json = "1.0"

[[test]]
name = "three_node_mesh"
path = "three_node_mesh.rs"

[[test]]
name = "durable_session"
path = "tests/durable_session.rs"

[[test]]
name = "durable_send"
path = "tests/durable_send.rs"

[[test]]
name = "durable_shutdown"
path = "tests/durable_shutdown.rs"

[[test]]
name = "durable_checkpoint"
path = "tests/durable_checkpoint.rs"

[[test]]
name = "durable_creation"
path = "tests/durable_creation.rs"

[[test]]
name = "durable_poll"
path = "tests/durable_poll.rs"

[[test]]
name = "durable_delivery"
path = "tests/durable_delivery.rs"

[[test]]
name = "durable_diagnostics"
path = "tests/durable_diagnostics.rs"

[[test]]
name = "durable_compaction"
path = "tests/durable_compaction.rs"

[[test]]
name = "durable_observability"
path = "tests/durable_observability.rs"

[[test]]
name = "durable_metadata_recovery"
path = "tests/durable_metadata_recovery.rs"
