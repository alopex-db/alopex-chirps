name: CI

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, 'release/**']

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test Suite (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        exclude:
          # Only run beta on Linux to save CI time
          - os: macos-latest
            rust: beta
          - os: windows-latest
            rust: beta
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-features --workspace

      - name: Run doc tests
        run: cargo test --doc --workspace

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  release-acceptance:
    name: Release Branch Acceptance
    if: startsWith(github.ref, 'refs/heads/release/') || (github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate the release acceptance contract
        run: |
          set -euo pipefail
          branch="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"
          case "${branch}" in
            release/v*) version="${branch#release/v}" ;;
            *) echo "Expected a release/vX.Y.Z branch, got ${branch}" >&2; exit 1 ;;
          esac
          cargo_version="$(python -c $'import sys\nimport tomllib\n\nwith open("Cargo.toml", "rb") as handle:\n    data = tomllib.load(handle)\n\nversion = data.get("workspace", {}).get("package", {}).get("version")\nif not version:\n    sys.exit("Failed to read workspace.package version from Cargo.toml")\n\nprint(version)')"
          [[ "${version}" == "${cargo_version}" ]] || {
            echo "Release branch version ${version} does not match Cargo.toml ${cargo_version}" >&2
            exit 1
          }
          scripts/verify-release-contract.sh --version "${version}"
      - name: Run workspace release-candidate tests
        run: cargo test --workspace --all-features --no-fail-fast
      - name: Run release-candidate documentation tests
        run: cargo test --doc --workspace
      - name: Run File Transfer release acceptance tests
        run: cargo test -p alopex-chirps-file-transfer --all-features
      - name: Run QUIC network integration tests
        run: cargo test -p alopex-chirps-transport-quic --test quic_integration -- --ignored
      - name: Run three-node mesh integration tests
        run: cargo test -p chirps-e2e --test three_node_mesh -- --ignored --test-threads=1

  ci-success:
    name: CI Success
    needs: [fmt, clippy, test, coverage, security-audit, release-acceptance]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.fmt.result }}" != "success" ]] || \
             [[ "${{ needs.clippy.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.coverage.result }}" != "success" ]] || \
             [[ "${{ needs.security-audit.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          if [[ "${{ needs.release-acceptance.result }}" != "success" ]] && \
             [[ "${{ needs.release-acceptance.result }}" != "skipped" ]]; then
            echo "Release branch acceptance failed"
            exit 1
          fi
          echo "All CI jobs passed!"
