name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated tag to create after all gates pass (chirps-vX.Y.Z)
        required: true
        type: string
      commit:
        description: Exact 40-character commit SHA to verify and tag
        required: true
        type: string
      confirm_publish:
        description: Confirm that the release contract and evidence have been reviewed
        required: true
        type: boolean
      resume_partial_publish:
        description: Resume a partially published release whose exact annotated tag already exists
        required: false
        default: false
        type: boolean
      v07_artifact_run_id:
        description: Run ID containing the frozen v0.7 candidate/evidence/release bytes
        required: false
        type: string
      v07_artifact_name:
        description: Exact artifact name containing the frozen v0.7 release bundle
        required: false
        default: chirps-v0.7.0-release-bundle
        type: string

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  RELEASE_MAX_AGE_DAYS: 5
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_COMMIT: ${{ inputs.commit }}
  RELEASE_CONFIRM: ${{ inputs.confirm_publish }}
  RESUME_PARTIAL_PUBLISH: ${{ inputs.resume_partial_publish }}

concurrency:
  group: chirps-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # Run CI checks before release
  ci-gate:
    name: CI Gate
    env:
      CHIRPS_SOURCE_ROOT: ${{ github.workspace }}/source
      CHIRPS_RELEASE_TOOLS_COMMIT: ${{ github.sha }}
    defaults:
      run:
        working-directory: source
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.release_metadata.outputs.version }}
      commit: ${{ steps.release_metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          path: source
      # Release tooling is taken from the revision that supplied this
      # workflow, not from the historical release commit under test. This is
      # what makes recovery of an old partial publish use the fixed tooling.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: release-tools
      - name: Verify publish confirmation, tag candidate, commit, and version
        id: release_metadata
        run: |
          set -euo pipefail
          [[ "${RELEASE_CONFIRM}" == "true" ]] || {
            echo "confirm_publish must be true" >&2
            exit 1
          }
          tag="${RELEASE_TAG}"
          prefix="chirps-v"
          if [[ "${tag}" != "${prefix}"* ]]; then
            echo "Expected tag prefix ${prefix}, got ${tag}"
            exit 1
          fi
          tag_version="${tag#${prefix}}"
          [[ "${tag_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Expected semantic version in ${tag}" >&2
            exit 1
          }
          [[ "${RELEASE_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "commit must be an exact lowercase 40-character SHA" >&2
            exit 1
          }
          cd "$GITHUB_WORKSPACE/source"
          [[ "$(git rev-parse HEAD)" == "${RELEASE_COMMIT}" ]] || {
            echo "checkout does not match requested commit" >&2
            exit 1
          }
          existing_tag_commit="$(git ls-remote origin "refs/tags/${tag}^{}" | awk '{print $1}')"
          if [[ -n "${existing_tag_commit}" ]]; then
            if [[ "${RESUME_PARTIAL_PUBLISH}" != "true" ]]; then
              echo "Refusing to reuse existing remote tag ${tag}; set resume_partial_publish=true only for an exact partial publish recovery" >&2
              exit 1
            fi
            [[ "${existing_tag_commit}" == "${RELEASE_COMMIT}" ]] || {
              echo "Existing tag ${tag} does not point to requested commit" >&2
              exit 1
            }
            echo "Resuming partial publish for existing tag ${tag} at ${existing_tag_commit}"
          fi
          cargo_version="$(python -c $'import sys\nimport tomllib\n\nwith open("Cargo.toml", "rb") as handle:\n    data = tomllib.load(handle)\n\nversion = data.get("workspace", {}).get("package", {}).get("version")\nif not version:\n    sys.exit("Failed to read workspace.package version from Cargo.toml")\n\nprint(version)')"
          if [[ -z "${cargo_version}" ]]; then
            echo "Failed to read workspace.package version from Cargo.toml"
            exit 1
          fi
          if [[ "${tag_version}" != "${cargo_version}" ]]; then
            echo "Tag ${tag_version} does not match Cargo.toml version ${cargo_version}"
            exit 1
          fi
          echo "Tag version ${tag_version} matches Cargo.toml"
          echo "version=${tag_version}" >> "${GITHUB_OUTPUT}"
          echo "commit=${RELEASE_COMMIT}" >> "${GITHUB_OUTPUT}"
          if [[ "${tag_version}" == "0.7.0" ]]; then
            [[ "${{ inputs.v07_artifact_run_id }}" =~ ^[0-9]+$ ]] || {
              echo "v0.7.0 requires an exact numeric v07_artifact_run_id" >&2
              exit 1
            }
          fi
          requirements="docs/release/evidence/v${tag_version}/required-evidence.json"
          if [[ -f "$requirements" ]]; then
            echo "evidence_required=true" >> "${GITHUB_OUTPUT}"
          else
            evidence_dir="docs/release/evidence/v${tag_version}"
            if [[ -d "$evidence_dir" ]] && find "$evidence_dir" -type f -print -quit | grep -q .; then
              echo "Evidence artifacts exist without a required-evidence catalog: ${evidence_dir}" >&2
              exit 1
            fi
            echo "evidence_required=false" >> "${GITHUB_OUTPUT}"
            echo "No required-evidence catalog for ${tag_version}; version-bound evidence gate is not required"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify v0.7 release and publication structure
        if: steps.release_metadata.outputs.version == '0.7.0'
        run: |
          scripts/run-v0.7-release-gate.sh --structure-only
          scripts/release/test-publish-v0.7-bundle.sh
          scripts/verify-release-contract.sh --publication-workflow
      - name: Set trusted verifier runtime path
        if: steps.release_metadata.outputs.version == '0.7.0'
        run: echo "CHIRPS_PERF_VERIFIER=${RUNNER_TEMP}/chirps-perf-verifier/chirps-durable-perf" >> "$GITHUB_ENV"
      - name: Build trusted read-only PERF verifier from workflow source
        if: steps.release_metadata.outputs.version == '0.7.0'
        run: |
          python3 "$GITHUB_WORKSPACE/release-tools/scripts/release/v07_perf_verifier.py" build \
            --source-root "$GITHUB_WORKSPACE/release-tools" \
            --source-commit "${{ github.sha }}" \
            --output "${RUNNER_TEMP}/chirps-perf-verifier"
      - name: Store same-run trusted PERF verifier
        if: steps.release_metadata.outputs.version == '0.7.0'
        uses: actions/upload-artifact@v4
        with:
          name: chirps-v07-perf-verifier-${{ github.run_id }}
          path: ${{ runner.temp }}/chirps-perf-verifier
          if-no-files-found: error
      - name: Download frozen v0.7 candidate, evidence, and release bytes
        if: steps.release_metadata.outputs.version == '0.7.0'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.v07_artifact_name }}
          path: ${{ runner.temp }}/chirps-v0.7-release-bundle
          github-token: ${{ github.token }}
          run-id: ${{ inputs.v07_artifact_run_id }}
      - name: Verify frozen v0.7 evidence without rebuilding
        if: steps.release_metadata.outputs.version == '0.7.0'
        run: |
          root="${RUNNER_TEMP}/chirps-v0.7-release-bundle"
          scripts/run-v0.7-release-gate.sh \
            --candidate "${root}/candidate.json" \
            --evidence "${root}/evidence.json" \
            --bundle "${root}/bundle.json"
      - name: Run version-bound release evidence gate
        if: steps.release_metadata.outputs.evidence_required == 'true'
        run: |
          bash "$GITHUB_WORKSPACE/release-tools/scripts/run-release-evidence-gate.sh" \
            --repo-root "$GITHUB_WORKSPACE/source" \
            --version "${{ steps.release_metadata.outputs.version }}" \
            --output-dir "${RUNNER_TEMP}/chirps-${{ steps.release_metadata.outputs.version }}-release-evidence" \
            --source-commit "${{ steps.release_metadata.outputs.commit }}"
      - name: Verify release contract and version-bound evidence
        run: |
          version="${{ steps.release_metadata.outputs.version }}"
          commit="${{ steps.release_metadata.outputs.commit }}"
          args=(--repo-root "$GITHUB_WORKSPACE/source" --version "${version}")
          if [[ "${version}" == "0.7.0" ]]; then
            root="${RUNNER_TEMP}/chirps-v0.7-release-bundle"
            args+=(
              --source-commit "${commit}"
              --candidate "${root}/candidate.json"
              --evidence "${root}/evidence.json"
              --bundle "${root}/bundle.json"
            )
          else
            args+=(--require-ready)
            if [[ "${{ steps.release_metadata.outputs.evidence_required }}" == "true" ]]; then
              args+=(--manifest "${RUNNER_TEMP}/chirps-${version}-release-evidence/manifest.json")
              args+=(--source-commit "${commit}")
            fi
          fi
          bash "$GITHUB_WORKSPACE/release-tools/scripts/verify-release-contract.sh" "${args[@]}"
      - name: Archive version-bound release evidence
        if: steps.release_metadata.outputs.evidence_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chirps-${{ steps.release_metadata.outputs.version }}-release-evidence-${{ steps.release_metadata.outputs.commit }}
          path: ${{ runner.temp }}/chirps-${{ steps.release_metadata.outputs.version }}-release-evidence
          if-no-files-found: error
      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: source
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: source
      - name: Run tests
        run: cargo test --workspace --all-features -- --test-threads=1
        working-directory: source
      - name: Run documentation tests
        run: cargo test --doc --workspace
        working-directory: source
      - name: Run File Transfer release acceptance tests
        run: cargo test -p alopex-chirps-file-transfer --all-features
        working-directory: source
      - name: Run QUIC network integration tests
        run: cargo test -p alopex-chirps-transport-quic --test quic_integration -- --ignored
        working-directory: source
      - name: Run three-node mesh integration tests
        run: cargo test -p chirps-e2e --test three_node_mesh -- --ignored
        working-directory: source

  publish-tag:
    name: Publish verified annotated tag
    needs: [ci-gate]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Reject stale release run
        run: |
          set -euo pipefail
          [[ "${RELEASE_MAX_AGE_DAYS}" =~ ^[0-9]+$ ]] || {
            echo "RELEASE_MAX_AGE_DAYS must be a non-negative integer" >&2
            exit 1
          }
          created_at="$(curl --fail --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            | jq -er '.created_at')"
          created_epoch="$(date --date="${created_at}" +%s)"
          now_epoch="$(date +%s)"
          age_seconds=$((now_epoch - created_epoch))
          max_age_seconds=$((RELEASE_MAX_AGE_DAYS * 24 * 60 * 60))
          if (( age_seconds >= max_age_seconds )); then
            echo "This release run was dispatched at ${created_at} and is at least ${RELEASE_MAX_AGE_DAYS} days old. Cancel this run and dispatch a new run; do not approve this stale run." >&2
            exit 1
          fi
          echo "Release run age is ${age_seconds}s; maximum allowed age is ${max_age_seconds}s"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Create and push annotated tag
        if: inputs.resume_partial_publish != true
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${RELEASE_COMMIT}" ]] || {
            echo "checkout does not match verified commit" >&2
            exit 1
          }
          if [[ -n "$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}")" ]]; then
            echo "Refusing to overwrite existing remote tag ${RELEASE_TAG}" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" -m "Alopex Chirps ${RELEASE_TAG#chirps-v}"
          git push origin "refs/tags/${RELEASE_TAG}"
      - name: Verify existing annotated tag for partial publish recovery
        if: inputs.resume_partial_publish == true
        run: |
          set -euo pipefail
          existing_tag_commit="$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | awk '{print $1}')"
          [[ "${existing_tag_commit}" == "${RELEASE_COMMIT}" ]] || {
            echo "Existing tag ${RELEASE_TAG} does not point to requested commit" >&2
            exit 1
          }

  publish-crate:
    name: Publish to crates.io
    needs: [ci-gate, publish-tag]
    if: needs.ci-gate.outputs.version != '0.7.0'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Reject stale release run
        run: |
          set -euo pipefail
          [[ "${RELEASE_MAX_AGE_DAYS}" =~ ^[0-9]+$ ]] || {
            echo "RELEASE_MAX_AGE_DAYS must be a non-negative integer" >&2
            exit 1
          }
          created_at="$(curl --fail --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            | jq -er '.created_at')"
          created_epoch="$(date --date="${created_at}" +%s)"
          now_epoch="$(date +%s)"
          age_seconds=$((now_epoch - created_epoch))
          max_age_seconds=$((RELEASE_MAX_AGE_DAYS * 24 * 60 * 60))
          if (( age_seconds >= max_age_seconds )); then
            echo "This release run was dispatched at ${created_at} and is at least ${RELEASE_MAX_AGE_DAYS} days old. Cancel this run and dispatch a new run; do not approve this stale run." >&2
            exit 1
          fi
          echo "Release run age is ${age_seconds}s; maximum allowed age is ${max_age_seconds}s"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          path: source
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: release-tools
          sparse-checkout: |
            scripts
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Resolve dependency layers and publish crates
        run: |
          bash "$GITHUB_WORKSPACE/release-tools/scripts/publish-crates.sh" \
            --repo-root "$GITHUB_WORKSPACE/source"

  publish-v07-bundle:
    name: Publish exact stored v0.7 bundle
    needs: [ci-gate, publish-tag]
    if: needs.ci-gate.outputs.version == '0.7.0'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      CHIRPS_RELEASE_ENVIRONMENT_APPROVAL: release:${{ inputs.commit }}
      CHIRPS_SOURCE_ROOT: ${{ github.workspace }}
      CHIRPS_RELEASE_TOOLS_COMMIT: ${{ github.sha }}
    steps:
      - name: Reject stale release run
        run: |
          set -euo pipefail
          [[ "${RELEASE_MAX_AGE_DAYS}" =~ ^[0-9]+$ ]] || {
            echo "RELEASE_MAX_AGE_DAYS must be a non-negative integer" >&2
            exit 1
          }
          created_at="$(curl --fail --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            | jq -er '.created_at')"
          created_epoch="$(date --date="${created_at}" +%s)"
          now_epoch="$(date +%s)"
          age_seconds=$((now_epoch - created_epoch))
          max_age_seconds=$((RELEASE_MAX_AGE_DAYS * 24 * 60 * 60))
          if (( age_seconds >= max_age_seconds )); then
            echo "This release run was dispatched at ${created_at} and is at least ${RELEASE_MAX_AGE_DAYS} days old. Cancel this run and dispatch a new run; do not approve this stale run." >&2
            exit 1
          fi
          echo "Release run age is ${age_seconds}s; maximum allowed age is ${max_age_seconds}s"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: release-tools
      - name: Verify exact checkout identity
        run: |
          [[ "$(git rev-parse HEAD)" == "${RELEASE_COMMIT}" ]] || {
            echo "checkout does not match the approved release commit" >&2
            exit 1
          }
      - name: Download the same frozen v0.7 byte bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.v07_artifact_name }}
          path: ${{ runner.temp }}/chirps-v0.7-release-bundle
          github-token: ${{ github.token }}
          run-id: ${{ inputs.v07_artifact_run_id }}
      - name: Set publication verification runtime paths
        run: |
          echo "CHIRPS_PERF_VERIFIER=${RUNNER_TEMP}/chirps-perf-verifier/chirps-durable-perf" >> "$GITHUB_ENV"
          echo "CHIRPS_POSTPUBLISH_EVIDENCE_DIR=${RUNNER_TEMP}/chirps-v07-registry-consumer" >> "$GITHUB_ENV"
      - name: Download trusted PERF verifier from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: chirps-v07-perf-verifier-${{ github.run_id }}
          path: ${{ runner.temp }}/chirps-perf-verifier
      - name: Restore verifier executable mode
        run: chmod 755 "$CHIRPS_PERF_VERIFIER"
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate production image destination
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install stored-image copy tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - name: Publish nine archives, production image, and GitHub assets from stored bytes
        run: |
          root="${RUNNER_TEMP}/chirps-v0.7-release-bundle"
          "$GITHUB_WORKSPACE/release-tools/scripts/release/publish-v0.7-bundle.sh" \
            --bundle "${root}/release-bundle.json" \
            --candidate "${root}/candidate.json" \
            --evidence "${root}/evidence.json" \
            --require-environment-approval \
            --resume-only-on-checksum-match
      - name: Preserve post-upload registry consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chirps-v07-registry-consumer-${{ github.run_id }}
          path: ${{ runner.temp }}/chirps-v07-registry-consumer
          if-no-files-found: warn


  create-release:
    name: Create GitHub Release
    needs: [ci-gate, publish-crate]
    if: needs.ci-gate.outputs.version != '0.7.0'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Reject stale release run
        run: |
          set -euo pipefail
          [[ "${RELEASE_MAX_AGE_DAYS}" =~ ^[0-9]+$ ]] || {
            echo "RELEASE_MAX_AGE_DAYS must be a non-negative integer" >&2
            exit 1
          }
          created_at="$(curl --fail --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            | jq -er '.created_at')"
          created_epoch="$(date --date="${created_at}" +%s)"
          now_epoch="$(date +%s)"
          age_seconds=$((now_epoch - created_epoch))
          max_age_seconds=$((RELEASE_MAX_AGE_DAYS * 24 * 60 * 60))
          if (( age_seconds >= max_age_seconds )); then
            echo "This release run was dispatched at ${created_at} and is at least ${RELEASE_MAX_AGE_DAYS} days old. Cancel this run and dispatch a new run; do not approve this stale run." >&2
            exit 1
          fi
          echo "Release run age is ${age_seconds}s; maximum allowed age is ${max_age_seconds}s"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
