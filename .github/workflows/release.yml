name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated tag in the form chirps-vX.Y.Z
        required: true
        type: string
      confirm_publish:
        description: Confirm that the release contract and evidence have been reviewed
        required: true
        type: boolean

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_CONFIRM: ${{ inputs.confirm_publish }}

concurrency:
  group: chirps-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # Run CI checks before release
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify publish confirmation, annotated tag, and version
        run: |
          set -euo pipefail
          [[ "${RELEASE_CONFIRM}" == "true" ]] || {
            echo "confirm_publish must be true" >&2
            exit 1
          }
          tag="${RELEASE_TAG}"
          prefix="chirps-v"
          if [[ "${tag}" != "${prefix}"* ]]; then
            echo "Expected tag prefix ${prefix}, got ${tag}"
            exit 1
          fi
          if [[ "$(git cat-file -t "${tag}")" != "tag" ]]; then
            echo "${tag} must be an annotated tag" >&2
            exit 1
          fi
          tag_version="${tag#${prefix}}"
          [[ "${tag_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Expected semantic version in ${tag}" >&2
            exit 1
          }
          cargo_version="$(python -c $'import sys\nimport tomllib\n\nwith open("Cargo.toml", "rb") as handle:\n    data = tomllib.load(handle)\n\nversion = data.get("workspace", {}).get("package", {}).get("version")\nif not version:\n    sys.exit("Failed to read workspace.package version from Cargo.toml")\n\nprint(version)')"
          if [[ -z "${cargo_version}" ]]; then
            echo "Failed to read workspace.package version from Cargo.toml"
            exit 1
          fi
          if [[ "${tag_version}" != "${cargo_version}" ]]; then
            echo "Tag ${tag_version} does not match Cargo.toml version ${cargo_version}"
            exit 1
          fi
          echo "Tag version ${tag_version} matches Cargo.toml"
          scripts/verify-release-contract.sh --version "${tag_version}" --require-ready
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-features
      - name: Run documentation tests
        run: cargo test --doc --workspace
      - name: Run File Transfer release acceptance tests
        run: cargo test -p alopex-chirps-file-transfer --all-features
      - name: Run QUIC network integration tests
        run: cargo test -p alopex-chirps-transport-quic --test quic_integration -- --ignored
      - name: Run three-node mesh integration tests
        run: cargo test -p chirps-e2e --test three_node_mesh -- --ignored

  publish-crate:
    name: Publish to crates.io
    needs: [ci-gate]
    runs-on: ubuntu-latest
    environment: release
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Layer 1: No internal dependencies
      - name: Publish alopex-chirps-wire
        run: ./scripts/publish-crate.sh alopex-chirps-wire

      - name: Publish alopex-chirps-raft-storage
        run: ./scripts/publish-crate.sh alopex-chirps-raft-storage

      - name: Wait for crates.io index update
        run: sleep 30

      # Layer 2: Depends on alopex-chirps-wire
      - name: Publish alopex-chirps-core
        run: ./scripts/publish-crate.sh alopex-chirps-core

      - name: Publish alopex-chirps-gossip-swim
        run: ./scripts/publish-crate.sh alopex-chirps-gossip-swim

      - name: Wait for crates.io index update
        run: sleep 30

      # Layer 3: Depends on alopex-chirps-wire + alopex-chirps-core
      - name: Publish alopex-chirps-mock
        run: ./scripts/publish-crate.sh alopex-chirps-mock

      - name: Publish alopex-chirps-file-transfer
        run: ./scripts/publish-crate.sh alopex-chirps-file-transfer

      - name: Publish alopex-chirps-transport-quic
        run: ./scripts/publish-crate.sh alopex-chirps-transport-quic

      - name: Wait for crates.io index update
        run: sleep 30

      # Layer 4: Depends on all above
      - name: Publish alopex-chirps
        run: ./scripts/publish-crate.sh alopex-chirps

  create-release:
    name: Create GitHub Release
    needs: publish-crate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
