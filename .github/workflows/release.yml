name: Release

on:
  push:
    tags:
      - 'chirps-v*'

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # Run CI checks before release
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-features

  publish-crate:
    name: Publish to crates.io
    needs: ci-gate
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Layer 1: No internal dependencies
      - name: Publish chirps-wire
        run: cargo publish -p chirps-wire
        continue-on-error: true

      - name: Publish chirps-raft-storage
        run: cargo publish -p chirps-raft-storage
        continue-on-error: true

      - name: Wait for crates.io index update
        run: sleep 30

      # Layer 2: Depends on chirps-wire
      - name: Publish chirps-core
        run: cargo publish -p chirps-core
        continue-on-error: true

      - name: Publish chirps-gossip-swim
        run: cargo publish -p chirps-gossip-swim
        continue-on-error: true

      - name: Wait for crates.io index update
        run: sleep 30

      # Layer 3: Depends on chirps-wire + chirps-core
      - name: Publish chirps-mock
        run: cargo publish -p chirps-mock
        continue-on-error: true

      - name: Publish chirps-transport-quic
        run: cargo publish -p chirps-transport-quic
        continue-on-error: true

      - name: Wait for crates.io index update
        run: sleep 30

      # Layer 4: Depends on all above
      - name: Publish alopex-chirps
        run: cargo publish -p alopex-chirps
        continue-on-error: true

  create-release:
    name: Create GitHub Release
    needs: publish-crate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
