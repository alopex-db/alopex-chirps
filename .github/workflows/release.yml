name: Release

on:
  push:
    tags:
      - 'chirps-v*'

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # Run CI checks before release
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches Cargo.toml version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          prefix="chirps-v"
          if [[ "${tag}" != "${prefix}"* ]]; then
            echo "Expected tag prefix ${prefix}, got ${tag}"
            exit 1
          fi
          tag_version="${tag#${prefix}}"
          cargo_version="$(python -c $'import sys\nimport tomllib\n\nwith open("Cargo.toml", "rb") as handle:\n    data = tomllib.load(handle)\n\nversion = data.get("workspace", {}).get("package", {}).get("version")\nif not version:\n    sys.exit("Failed to read workspace.package version from Cargo.toml")\n\nprint(version)')"
          if [[ -z "${cargo_version}" ]]; then
            echo "Failed to read workspace.package version from Cargo.toml"
            exit 1
          fi
          if [[ "${tag_version}" != "${cargo_version}" ]]; then
            echo "Tag ${tag_version} does not match Cargo.toml version ${cargo_version}"
            exit 1
          fi
          echo "Tag version ${tag_version} matches Cargo.toml"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-features

  publish-crate:
    name: Publish to crates.io
    needs: ci-gate
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Layer 1: No internal dependencies
      - name: Publish alopex-chirps-wire
        run: ./scripts/publish-crate.sh alopex-chirps-wire
        continue-on-error: true

      - name: Publish alopex-chirps-raft-storage
        run: ./scripts/publish-crate.sh alopex-chirps-raft-storage
        continue-on-error: true

      - name: Wait for crates.io index update
        run: sleep 30

      # Layer 2: Depends on alopex-chirps-wire
      - name: Publish alopex-chirps-core
        run: ./scripts/publish-crate.sh alopex-chirps-core
        continue-on-error: true

      - name: Publish alopex-chirps-gossip-swim
        run: ./scripts/publish-crate.sh alopex-chirps-gossip-swim
        continue-on-error: true

      - name: Wait for crates.io index update
        run: sleep 30

      # Layer 3: Depends on alopex-chirps-wire + alopex-chirps-core
      - name: Publish alopex-chirps-mock
        run: ./scripts/publish-crate.sh alopex-chirps-mock
        continue-on-error: true

      - name: Publish alopex-chirps-file-transfer
        run: ./scripts/publish-crate.sh alopex-chirps-file-transfer
        continue-on-error: true

      - name: Publish alopex-chirps-transport-quic
        run: ./scripts/publish-crate.sh alopex-chirps-transport-quic
        continue-on-error: true

      - name: Wait for crates.io index update
        run: sleep 30

      # Layer 4: Depends on all above
      - name: Publish alopex-chirps
        run: ./scripts/publish-crate.sh alopex-chirps
        continue-on-error: true

  create-release:
    name: Create GitHub Release
    needs: publish-crate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
