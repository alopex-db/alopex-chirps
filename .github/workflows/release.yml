name: Release

on:
  push:
    tags:
      - 'chirps-v*'

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # Run CI checks before release
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches Cargo.toml version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          prefix="chirps-v"
          if [[ "${tag}" != "${prefix}"* ]]; then
            echo "Expected tag prefix ${prefix}, got ${tag}"
            exit 1
          fi
          tag_version="${tag#${prefix}}"
          cargo_version="$(python -c $'import sys\nimport tomllib\n\nwith open("Cargo.toml", "rb") as handle:\n    data = tomllib.load(handle)\n\nversion = data.get("workspace", {}).get("package", {}).get("version")\nif not version:\n    sys.exit("Failed to read workspace.package version from Cargo.toml")\n\nprint(version)')"
          if [[ -z "${cargo_version}" ]]; then
            echo "Failed to read workspace.package version from Cargo.toml"
            exit 1
          fi
          if [[ "${tag_version}" != "${cargo_version}" ]]; then
            echo "Tag ${tag_version} does not match Cargo.toml version ${cargo_version}"
            exit 1
          fi
          echo "Tag version ${tag_version} matches Cargo.toml"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-features
      - name: Run documentation tests
        run: cargo test --doc --workspace
      - name: Run File Transfer release acceptance tests
        run: cargo test -p alopex-chirps-file-transfer --all-features
      - name: Run QUIC network integration tests
        run: cargo test -p alopex-chirps-transport-quic --test quic_integration -- --ignored
      - name: Run three-node mesh integration tests
        run: cargo test -p chirps-e2e --test three_node_mesh -- --ignored

  file-transfer-performance:
    name: Physical two-node File Transfer 1 Gbps performance gate
    needs: ci-gate
    runs-on: [self-hosted, linux, chirps-1gbps-controller]
    timeout-minutes: 30
    env:
      CHIRPS_PERF_SENDER_HOST: ${{ vars.CHIRPS_PERF_SENDER_HOST }}
      CHIRPS_PERF_RECEIVER_HOST: ${{ vars.CHIRPS_PERF_RECEIVER_HOST }}
      CHIRPS_PERF_REMOTE_WORKDIR: ${{ vars.CHIRPS_PERF_REMOTE_WORKDIR }}
      CHIRPS_PERF_REMOTE_OUTPUT_ROOT: ${{ vars.CHIRPS_PERF_REMOTE_OUTPUT_ROOT }}
      CHIRPS_PERF_SENDER_CONTROL_BIND: ${{ vars.CHIRPS_PERF_SENDER_CONTROL_BIND }}
      CHIRPS_PERF_SENDER_CONTROL_ADDRESS: ${{ vars.CHIRPS_PERF_SENDER_CONTROL_ADDRESS }}
      CHIRPS_PERF_RECEIVER_CONTROL_BIND: ${{ vars.CHIRPS_PERF_RECEIVER_CONTROL_BIND }}
      CHIRPS_PERF_RECEIVER_CONTROL_ADDRESS: ${{ vars.CHIRPS_PERF_RECEIVER_CONTROL_ADDRESS }}
      CHIRPS_PERF_SENDER_DATA_BIND: ${{ vars.CHIRPS_PERF_SENDER_DATA_BIND }}
      CHIRPS_PERF_SENDER_DATA_ADDRESS: ${{ vars.CHIRPS_PERF_SENDER_DATA_ADDRESS }}
      CHIRPS_PERF_RECEIVER_DATA_BIND: ${{ vars.CHIRPS_PERF_RECEIVER_DATA_BIND }}
      CHIRPS_PERF_RECEIVER_DATA_ADDRESS: ${{ vars.CHIRPS_PERF_RECEIVER_DATA_ADDRESS }}
      CHIRPS_PERF_RECEIVER_IPERF_ADDRESS: ${{ vars.CHIRPS_PERF_RECEIVER_IPERF_ADDRESS }}
      CHIRPS_PERF_OUTPUT: ${{ runner.temp }}/chirps-two-node-release-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Measure physical two-node v0.5.2 transfer
        run: |
          set -euo pipefail
          scripts/perf/run-two-node-file-transfer.sh \
            --sender "${CHIRPS_PERF_SENDER_HOST}" \
            --receiver "${CHIRPS_PERF_RECEIVER_HOST}" \
            --remote-workdir "${CHIRPS_PERF_REMOTE_WORKDIR}" \
            --remote-output-root "${CHIRPS_PERF_REMOTE_OUTPUT_ROOT}" \
            --output "${CHIRPS_PERF_OUTPUT}" \
            --sender-control-bind "${CHIRPS_PERF_SENDER_CONTROL_BIND}" \
            --sender-control-address "${CHIRPS_PERF_SENDER_CONTROL_ADDRESS}" \
            --receiver-control-bind "${CHIRPS_PERF_RECEIVER_CONTROL_BIND}" \
            --receiver-control-address "${CHIRPS_PERF_RECEIVER_CONTROL_ADDRESS}" \
            --sender-data-bind "${CHIRPS_PERF_SENDER_DATA_BIND}" \
            --sender-data-address "${CHIRPS_PERF_SENDER_DATA_ADDRESS}" \
            --receiver-data-bind "${CHIRPS_PERF_RECEIVER_DATA_BIND}" \
            --receiver-data-address "${CHIRPS_PERF_RECEIVER_DATA_ADDRESS}" \
            --receiver-iperf-address "${CHIRPS_PERF_RECEIVER_IPERF_ADDRESS}"
      - name: Require eligible evidence
        run: |
          set -euo pipefail
          python - "${CHIRPS_PERF_OUTPUT}/evidence/result.json" <<'PY'
            import json
            import sys

            with open(sys.argv[1], encoding="utf-8") as handle:
                result = json.load(handle)
            if result.get("release_eligible") is not True:
                raise SystemExit(f"physical two-node performance gate failed: {result}")
          PY
      - name: Upload physical measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chirps-two-node-release-evidence
          path: ${{ env.CHIRPS_PERF_OUTPUT }}
          if-no-files-found: warn
          retention-days: 90

  publish-crate:
    name: Publish to crates.io
    needs: [ci-gate, file-transfer-performance]
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Layer 1: No internal dependencies
      - name: Publish alopex-chirps-wire
        run: ./scripts/publish-crate.sh alopex-chirps-wire

      - name: Publish alopex-chirps-raft-storage
        run: ./scripts/publish-crate.sh alopex-chirps-raft-storage

      - name: Wait for crates.io index update
        run: sleep 30

      # Layer 2: Depends on alopex-chirps-wire
      - name: Publish alopex-chirps-core
        run: ./scripts/publish-crate.sh alopex-chirps-core

      - name: Publish alopex-chirps-gossip-swim
        run: ./scripts/publish-crate.sh alopex-chirps-gossip-swim

      - name: Wait for crates.io index update
        run: sleep 30

      # Layer 3: Depends on alopex-chirps-wire + alopex-chirps-core
      - name: Publish alopex-chirps-mock
        run: ./scripts/publish-crate.sh alopex-chirps-mock

      - name: Publish alopex-chirps-file-transfer
        run: ./scripts/publish-crate.sh alopex-chirps-file-transfer

      - name: Publish alopex-chirps-transport-quic
        run: ./scripts/publish-crate.sh alopex-chirps-transport-quic

      - name: Wait for crates.io index update
        run: sleep 30

      # Layer 4: Depends on all above
      - name: Publish alopex-chirps
        run: ./scripts/publish-crate.sh alopex-chirps

  create-release:
    name: Create GitHub Release
    needs: publish-crate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
