[workspace]
members = [
    "crates/alopex-chirps",
    "crates/chirps-transport-quic",
    "crates/chirps-gossip-swim",
    "crates/chirps-wire",
    "crates/chirps-mock",
]
resolver = "2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# QUIC protocol
quinn = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Networking
socket2 = "0.5"
bytes = "1.5"

# Testing
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 1
