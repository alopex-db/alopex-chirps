[workspace]
members = [
    "crates/alopex-chirps",
    "crates/chirps-file-transfer",
    "crates/chirps-transport-quic",
    "crates/chirps-gossip-swim",
    "crates/chirps-wire",
    "crates/chirps-mock",
    "crates/chirps-core",
    "crates/chirps-raft-storage",
    "tests/e2e",
    "tools/chirps-deterministic-harness",
    "tools/chirps-multi-raft-perf",
    "tools/chirps-v06-demo",
]
resolver = "2"

[workspace.package]
version = "0.6.1"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/alopex-db/alopex-chirps"
homepage = "https://github.com/alopex-db/alopex-chirps"
categories = ["network-programming", "asynchronous", "database"]

[workspace.dependencies]
# Internal crates
alopex-chirps = { version = "0.6.1", path = "crates/alopex-chirps" }
alopex-chirps-wire = { version = "0.6.1", path = "crates/chirps-wire" }
alopex-chirps-core = { version = "0.6.1", path = "crates/chirps-core" }
alopex-chirps-gossip-swim = { version = "0.6.1", path = "crates/chirps-gossip-swim" }
alopex-chirps-mock = { version = "0.6.1", path = "crates/chirps-mock" }
alopex-chirps-raft-storage = { version = "0.6.1", path = "crates/chirps-raft-storage" }
alopex-chirps-transport-quic = { version = "0.6.1", path = "crates/chirps-transport-quic" }
alopex-chirps-file-transfer = { version = "0.6.1", path = "crates/chirps-file-transfer" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# QUIC protocol
quinn = "0.11.11"

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Networking
socket2 = "0.5"
bytes = "1.11.1"

# Testing
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 1
