[failpoints]
environment = "IGGY_CHIRPS_FAILPOINT"
stages = [
    "message-open-sync",
    "index-open-sync",
    "append",
    "journal-flush",
    "message-sync",
    "index-sync",
    "response",
    "partial-write",
    "truncate",
    "checksum-failure",
    "unknown-version",
    "disk-full",
    "permission-denied",
    "read-only",
    "io-timeout",
    "snapshot-temp-write",
    "snapshot-file-sync",
    "snapshot-rename",
    "snapshot-directory-sync",
    "snapshot-install",
    "snapshot-apply",
]

[verification]
production_manifest = "server/iggy-compatible/manifest.toml"
required_symbols = ["IGGY_CHIRPS_FAILPOINT"]
production_forbidden_symbols = ["IGGY_CHIRPS_FAILPOINT", "ChirpsFailpoint"]
distinct_production_output = true
