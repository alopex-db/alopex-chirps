    "journal-flush",
    "message-sync",
    "index-sync",
    "response",
    "partial-write",
    "truncate",
    "checksum-failure",
    "unknown-version",
    "disk-full",
    "permission-denied",
    "read-only",
    "io-timeout",
    "snapshot-temp-write",
    "snapshot-file-sync",
    "snapshot-rename",
    "snapshot-directory-sync",
    "snapshot-install",
    "snapshot-apply",
]

[verification]
production_manifest = "server/iggy-compatible/manifest.toml"
